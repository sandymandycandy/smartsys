<script>
    // Fetch and display weather in navbar
    async function updateNavbarWeather() {
        try {
            const response = await fetch('/settings/weather/api/current');
            if (response.ok) {
                const data = await response.json();
                const weather = data.weather;
                if (weather && weather.temperature) {
                    document.getElementById('navbar-weather').textContent = weather.temperature.toFixed(1) + '°C';
                }
            }
        } catch (e) {
            console.log('Weather fetch skipped');
        }
    }

    // Update weather every 5 minutes
    if (document.getElementById('navbar-weather')) {
        updateNavbarWeather();
        setInterval(updateNavbarWeather, 300000);
    }
</script>
