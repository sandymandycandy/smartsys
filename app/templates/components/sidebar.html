<aside id="sidebar" class="w-64 bg-white shadow-lg overflow-y-auto transition-transform duration-300 ease-in-out 
              fixed lg:static inset-y-0 left-0 z-40 transform -translate-x-full lg:translate-x-0"
    x-data="{ open: false }"
    :class="{ '-translate-x-full': !$store.sidebar?.open, 'translate-x-0': $store.sidebar?.open }"
    @sidebar-toggle.window="$store.sidebar = { open: !$store.sidebar?.open }">

    <!-- Close button for mobile -->
    <div class="lg:hidden flex justify-end p-2">
        <button @click="$dispatch('sidebar-toggle')" class="p-2 text-gray-600 hover:text-gray-900">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </div>

    <nav class="mt-2 lg:mt-4 px-2 lg:px-4 pb-4">
        <!-- Main Navigation -->
        <p class="px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 hidden lg:block">Main</p>

        <a href="/dashboard"
            class="flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-blue-50 hover:text-blue-600 mb-1 transition">
            <span class="text-xl mr-3">📊</span>
            <span class="font-medium">Dashboard</span>
        </a>

        <a href="/dashboard/map"
            class="flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-blue-50 hover:text-blue-600 mb-1 transition">
            <span class="text-xl mr-3">📍</span>
            <span class="font-medium">Live Map</span>
        </a>

        <a href="/dashboard/animals"
            class="flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-blue-50 hover:text-blue-600 mb-1 transition">
            <span class="text-xl mr-3">🐮</span>
            <span class="font-medium">Animals</span>
        </a>

        <a href="/farms"
            class="flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-blue-50 hover:text-blue-600 mb-1 transition">
            <span class="text-xl mr-3">🌾</span>
            <span class="font-medium">Farms</span>
        </a>

        <a href="/dashboard/alerts"
            class="flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-blue-50 hover:text-blue-600 mb-1 transition">
            <span class="text-xl mr-3">🔔</span>
            <span class="font-medium">Alerts</span>
        </a>

        <a href="/dashboard/analytics"
            class="flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-blue-50 hover:text-blue-600 mb-1 transition">
            <span class="text-xl mr-3">📈</span>
            <span class="font-medium">Analytics</span>
        </a>

        <a href="/dashboard/ml-insights"
            class="flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-purple-50 hover:text-purple-600 mb-1 transition">
            <span class="text-xl mr-3">🤖</span>
            <span class="font-medium">ML Insights</span>
        </a>

        <hr class="my-3">

        <!-- Milk Production -->
        <p class="px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Production</p>

        <a href="/milk/dashboard"
            class="flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-green-50 hover:text-green-600 mb-1 transition">
            <span class="text-xl mr-3">🥛</span>
            <span class="font-medium">Milk Dashboard</span>
        </a>

        <a href="/milk/record"
            class="flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-green-50 hover:text-green-600 mb-1 transition">
            <span class="text-xl mr-3">📝</span>
            <span class="font-medium">Record Milk</span>
        </a>

        <a href="/milk/analytics"
            class="flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-green-50 hover:text-green-600 mb-1 transition">
            <span class="text-xl mr-3">📊</span>
            <span class="font-medium">Milk Analytics</span>
        </a>

        <hr class="my-3">

        <!-- Visualization -->
        <p class="px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Visualization</p>

        <a href="/settings/heatmap"
            class="flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-orange-50 hover:text-orange-600 mb-1 transition">
            <span class="text-xl mr-3">🔥</span>
            <span class="font-medium">Heatmap</span>
        </a>

        <a href="/settings/weather"
            class="flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-cyan-50 hover:text-cyan-600 mb-1 transition">

        <p class="px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Settings</p>

        <a href="/settings/geofences"
            class="flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-blue-50 hover:text-blue-600 mb-1 transition">

            class="flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-blue-50 hover:text-blue-600 mb-1 transition">
            <span class="text-xl mr-3">📬</span>
            <span class="font-medium">Notifications</span>
        </a>

        <a href="/settings/thresholds"
            class="flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-purple-50 hover:text-purple-600 mb-1 transition">
            <span class="text-xl mr-3">⚙️</span>
            <span class="font-medium">Thresholds</span>
        </a>

        <hr class="my-3">

        <!-- System -->
        <a href="/docs" target="_blank"
            class="flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-gray-50 hover:text-gray-900 mb-1 transition">
            <span class="text-xl mr-3">📚</span>
            <span class="font-medium">API Docs</span>
        </a>

        <a href="/auth/profile"

            <span class="text-xl mr-3">👤</span>
            <span class="font-medium">Profile</span>
        </a>

        <a href="/auth/logout"
            class="flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-red-50 hover:text-red-600 mb-1 transition">
            <span class="text-xl mr-3">🚪</span>
            <span class="font-medium">Logout</span>
        </a>
    </nav>
</aside>

<!-- Mobile overlay -->
<div class="fixed inset-0 bg-black bg-opacity-50 z-30 lg:hidden" x-show="$store.sidebar?.open"
    @click="$dispatch('sidebar-toggle')" x-cloak>
</div>
